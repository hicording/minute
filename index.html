<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minute</title>
<style>
:root{--bg:#fff;--sf:#f2f3f7;--tx:#16181d;--mu:#767b88;--ac:#5b5bf0;--bd:#e3e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--sf:#1e2026;--tx:#eceef3;--mu:#8b909c;--bd:#2c2f38}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.center{margin:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:34px;margin:0}h1 span{color:var(--ac)}
p.s{color:var(--mu);margin:0;font-size:14px}
input{font:inherit;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:100%;outline:none}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;flex:1}
button.g{background:var(--sf);color:var(--tx)}button.sm{padding:6px 10px;font-size:12px;border-radius:8px;flex:none}
.row{display:flex;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);gap:8px}
header small{color:var(--mu);display:block;font-size:12px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;align-self:flex-start}.m.me{align-self:flex-end}
.n{font-size:12px;color:var(--mu);margin:0 4px 2px}
.b{background:var(--sf);padding:9px 13px;border-radius:16px;word-break:break-word;white-space:pre-wrap}
.me .b{background:var(--ac);color:#fff}
.bar{height:2px;background:var(--ac);margin:3px 4px 0;border-radius:2px;opacity:.5}
.t{font-size:11px;color:var(--mu);margin:2px 4px;display:flex;gap:6px}.t a{color:#e5484d;cursor:pointer}
.sys{align-self:center;color:var(--mu);font-size:12px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
.tag{color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700}
.admin{background:#f5a623}.sub{background:#2fb344}
.err{color:#e5484d;font-size:13px;min-height:16px}
#us{display:none;padding:8px 12px;border-bottom:1px solid var(--bd);gap:6px;flex-direction:column}
#us .u{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb344;margin-right:6px}.off{background:var(--mu)}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
// ▼ Supabase > Project Settings > API 에서 복사해 붙여넣기
const SUPABASE_URL="https://drqjyvhgztnquadkpcyy.supabase.co";
const SUPABASE_KEY="sb_publishable_kCn-7ZjtLnMQ0WJwXdwZcQ_Dct1mqvr";

const $=s=>document.querySelector(s),app=$("#app"),TTL=60000;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const tag=r=>r==="admin"?'<span class="tag admin">관리자</span>':r==="sub"?'<span class="tag sub">부관리자</span>':"";
let sb,uid,code,msgs=[],members={},online=new Set(),ch=null,t1=null,t2=null,t3=null,off=0;
const myRole=()=>(members[uid]||{}).role||"user";

function login(msg){
  app.innerHTML=`<div class="center"><h1>Min<span>ute</span></h1><p class="s">보낸 메시지는 1분 뒤 사라져요. 방을 만든 사람이 관리자예요.</p>
  <input id="nm" placeholder="이름 (닉네임)" maxlength="16" value="${esc(st.get("m_name"))}">
  <input id="cd" placeholder="방 코드 (영문/숫자 4~12자)" maxlength="12" style="text-transform:uppercase" value="${esc(st.get("m_code"))}">
  <div class="err" id="er">${esc(msg||"")}</div>
  <div class="row"><button class="g" id="mk">방 만들기</button><button id="jn">입장</button></div></div>`;
  const go=fn=>async()=>{
    const n=$("#nm").value.trim(),c=$("#cd").value.trim().toUpperCase();
    st.set("m_name",n);st.set("m_code",c);$("#er").textContent="";
    try{
      if(!uid){const{data:{session}}=await sb.auth.getSession();
        if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}
        uid=(await sb.auth.getUser()).data.user.id}
      const{data,error}=await sb.rpc(fn,{p_code:c,p_name:n});
      if(error)throw new Error(/duplicate/i.test(error.message)?'이미 있는 코드예요':error.message);
      if(!data)throw new Error(fn==='create_room'?'이미 있는 코드이거나 입력이 올바르지 않아요 (코드는 영문/숫자 4~12자)':'없는 코드예요');
      await enter(c);
    }catch(e){$("#er").textContent=e.message||"실패했어요"}
  };
  $("#mk").onclick=go("create_room");$("#jn").onclick=go("join_room");
}

async function enter(c){
  code=c;msgs=[];members={};online=new Set();
  app.innerHTML=`<header><div><b>Minute</b><span id="rl"></span><small>코드 ${esc(c)}</small></div>
  <div class="row"><button class="g sm" id="ub"></button><button class="g sm" id="clr" style="display:none">전체삭제</button><button class="g sm" id="out">나가기</button></div></header>
  <div id="us"></div><div id="list"></div>
  <form id="f"><input id="tx" placeholder="메시지 입력" autocomplete="off" maxlength="500"><button>전송</button></form>`;
  $("#out").onclick=leave;
  $("#ub").onclick=()=>{const u=$("#us");u.style.display=u.style.display==="flex"?"none":"flex"};
  $("#clr").onclick=()=>confirm("모든 메시지를 삭제할까요?")&&sb.rpc("clear_room",{p_code:code});
  $("#f").onsubmit=async e=>{e.preventDefault();const v=$("#tx").value.trim();if(!v)return;$("#tx").value="";
    const{error}=await sb.rpc("send_message",{p_code:code,p_text:v});
    if(error)alert("전송 실패: "+error.message);else poll()};

  const{data:ts}=await sb.rpc("server_time");off=new Date(ts)-Date.now();
  const[{data:ms},{data:mm}]=await Promise.all([
    sb.from("members").select("*").eq("room_code",code),
    sb.from("messages").select("*").eq("room_code",code).gt("expires_at",new Date(Date.now()+off).toISOString()).order("created_at")]);
  (ms||[]).forEach(m=>members[m.user_id]=m);msgs=mm||[];
  head();drawUsers();draw();

  ch=sb.channel("room:"+code,{config:{presence:{key:uid}}})
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_code=eq."+code},p=>{if(!msgs.some(x=>x.id===p.new.id))msgs.push(p.new);draw()})
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{msgs=msgs.filter(m=>m.id!==p.old.id);draw()})
   .on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"room_code=eq."+code},p=>{
      if(p.new&&p.new.user_id){members[p.new.user_id]=p.new;head();drawUsers();draw()}})
   .on("presence",{event:"sync"},()=>{online=new Set(Object.keys(ch.presenceState()));drawUsers()})
   .subscribe(s=>{if(s==="SUBSCRIBED")ch.track({uid})});
  t1=setInterval(draw,1000);t2=setInterval(()=>sb.rpc("purge_expired"),10000);t3=setInterval(poll,2000);poll();
}
function leave(){if(ch)sb.removeChannel(ch);clearInterval(t1);clearInterval(t2);clearInterval(t3);ch=null;login()}
async function poll(){
  if(!code)return;
  const now=new Date(Date.now()+off).toISOString();
  const{data,error}=await sb.from("messages").select("*").eq("room_code",code).gt("expires_at",now).order("created_at");
  if(error){console.error(error);return}
  if(data){msgs=data;draw()}
  const{data:ms}=await sb.from("members").select("*").eq("room_code",code);
  if(ms){ms.forEach(m=>members[m.user_id]=m);head();drawUsers()}
}
function head(){const r=myRole();$("#rl").innerHTML=tag(r);$("#clr").style.display=r==="admin"?"":"none"}
function drawUsers(){
  const list=Object.values(members),r=myRole();
  $("#ub").textContent="참여자 "+online.size;
  $("#us").innerHTML=list.map(u=>`<div class="u"><span><i class="on ${online.has(u.user_id)?"":"off"}"></i>${esc(u.name)}${tag(u.role)}${u.user_id===uid?" (나)":""}</span>
  ${r==="admin"&&u.role!=="admin"?`<button class="g sm" data-u="${u.user_id}" data-r="${u.role==="sub"?"user":"sub"}">${u.role==="sub"?"부관리자 해제":"부관리자 지정"}</button>`:""}</div>`).join("");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>sb.rpc("set_role",{p_code:code,p_target:b.dataset.u,p_role:b.dataset.r}));
}
function draw(){
  const l=$("#list");if(!l)return;const now=Date.now()+off,mod=myRole()!=="user";
  msgs=msgs.filter(m=>Date.parse(m.expires_at)>now);
  const end=l.scrollHeight-l.scrollTop-l.clientHeight<80;
  l.innerHTML=msgs.length?msgs.map(m=>{const exp=Date.parse(m.expires_at);return`<div class="m ${m.user_id===uid?"me":""}"><div class="n">${esc(m.name)}${tag((members[m.user_id]||{}).role||m.role)}</div>
  <div class="b">${esc(m.text)}</div><div class="bar" style="width:${Math.max(0,(exp-now)/TTL*100)}%"></div>
  <div class="t">${Math.ceil((exp-now)/1000)}초 후 삭제${mod?` <a data-id="${m.id}">삭제</a>`:""}</div></div>`}).join(""):`<div class="sys">메시지가 없어요.</div>`;
  l.querySelectorAll("a[data-id]").forEach(a=>a.onclick=()=>sb.rpc("delete_message",{p_id:a.dataset.id}));
  if(end)l.scrollTop=l.scrollHeight;
}
if(SUPABASE_URL.includes("YOUR-PROJECT")){app.innerHTML='<div class="center"><h1>Min<span>ute</span></h1><p class="s">index.html 위쪽의 SUPABASE_URL과 SUPABASE_KEY를 먼저 채워주세요.</p></div>'}
else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);login()}
</script></body></html>

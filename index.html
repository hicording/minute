<style>
:root{--bg:#fff;--sf:#f2f3f7;--tx:#16181d;--mu:#767b88;--ac:#5b5bf0;--bd:#e3e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--sf:#1e2026;--tx:#eceef3;--mu:#8b909c;--bd:#2c2f38}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.center{margin:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:34px;margin:0}h1 span{color:var(--ac)}
p.s{color:var(--mu);margin:0;font-size:14px}
input{font:inherit;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:100%;outline:none}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;flex:1}
button.g{background:var(--sf);color:var(--tx)}button.sm{padding:6px 10px;font-size:12px;border-radius:8px;flex:none}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);gap:8px}
header small{color:var(--mu);display:block;font-size:12px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;align-self:flex-start}.m.me{align-self:flex-end}
.n{font-size:12px;color:var(--mu);margin:0 4px 2px}
.b{background:var(--sf);padding:9px 13px;border-radius:16px;word-break:break-word;white-space:pre-wrap}
.me .b{background:var(--ac);color:#fff}
.bar{height:2px;background:var(--ac);margin:3px 4px 0;border-radius:2px;opacity:.5}
.t{font-size:11px;color:var(--mu);margin:2px 4px;display:flex;gap:6px}.t a{color:#e5484d;cursor:pointer;padding:4px 8px;margin:-4px 0}
.b.img{padding:4px;line-height:0}.b.img img{max-width:100%;max-height:260px;border-radius:12px;display:block;cursor:zoom-in}
.t a.ed{color:var(--ac)}form button.g{background:var(--sf);font-size:18px}
.sys{align-self:center;color:var(--mu);font-size:12px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
.tag{color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700}
.admin{background:#f5a623}.sub{background:#2fb344}.crown{margin-left:4px;font-size:13px}form button{flex:none;width:48px;padding:0;display:grid;place-items:center}
.dv{border:0;border-top:1px solid var(--bd);margin:8px 0 4px;width:100%}
#rm{display:flex;flex-direction:column;gap:8px}.rm{display:flex;justify-content:space-between;align-items:center;text-align:left;flex:none}.rm small{color:var(--mu);font-weight:500}
.err{color:#e5484d;font-size:13px;min-height:16px}
#us{display:none;max-height:40vh;overflow-y:auto;padding:8px 12px;border-bottom:1px solid var(--bd);gap:6px;flex-direction:column}
#us .u{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb344;margin-right:6px}.off{background:var(--mu)}

#list{overflow-x:hidden}
.m{touch-action:pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.m.sw{transition:none}.m.sw::after{content:"↩";position:absolute;right:-26px;top:50%;margin-top:-10px;color:var(--mu)}
.rq{border-left:3px solid currentColor;padding:1px 8px;margin-bottom:5px;font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:3px 4px 0}.me .rx{justify-content:flex-end}
.rx i{font-style:normal;font-size:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1px 7px;cursor:pointer}.rx i.my{border-color:var(--ac)}
#pk{position:fixed;z-index:9;background:var(--bg);border:1px solid var(--bd);border-radius:18px;padding:6px 8px;box-shadow:0 4px 18px #0003}
#pk b{font-size:24px;font-weight:400;padding:2px 5px;cursor:pointer}
#pk .pa{display:flex;gap:14px;justify-content:center;border-top:1px solid var(--bd);margin-top:4px;padding-top:6px;font-size:13px}#pk .pa a{cursor:pointer}
#rp{display:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--sf)}
#rp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#rp a{cursor:pointer;padding:4px 8px}
#nt{display:none;background:var(--sf);border-bottom:1px solid var(--bd);max-height:26vh;overflow-y:auto}
.ni{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;font-size:13px}.ni span{flex:1;word-break:break-word}.ni small{color:var(--mu)}.ni a{color:#e5484d;cursor:pointer}
#pb{padding:6px 12px;border-bottom:1px solid var(--bd)}#pb button{width:100%;padding:8px;font-size:13px}
#pl{max-height:45vh;overflow-y:auto;padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:14px}
.pq{font-weight:700;font-size:14px}
.po{position:relative;display:flex;justify-content:space-between;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-top:5px;cursor:pointer;overflow:hidden;font-size:14px}
.po .pf{position:absolute;left:0;top:0;bottom:0;background:var(--ac);opacity:.18}.po.my{border-color:var(--ac)}.po span,.po small{position:relative}
.pm{font-size:11px;color:var(--mu);display:flex;justify-content:space-between;margin-top:4px}.pm a{color:#e5484d;cursor:pointer}
#md{position:fixed;inset:0;background:#0007;z-index:10;display:grid;place-items:center;padding:16px}
#md .box{background:var(--bg);border-radius:16px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}
#po{display:flex;flex-direction:column;gap:6px}
.rq[data-rt]{cursor:pointer}@keyframes fl{0%,60%{background:#f5a62355}}.m.fl .b{animation:fl 1.4s}

      await enter(c);
    }catch(e){$("#er").textContent=e.message||"실패했어요"}
  };
  $("#mk").onclick=go("create_room");$("#jn").onclick=go("join_room");
}

async function enter(c){
  code=c;msgs=[];members={};online=new Set();bans=[];ex={notes:[],polls:[],reacts:[]};rep=null;sn=sp="";openPl=false;
  app.innerHTML=`<header><div><b>Minute</b><span id="rl"></span><small>코드 ${esc(c)}</small></div>
  <div class="row"><button class="g sm" id="ub"></button><button class="g sm" id="clr" style="display:none">전체삭제</button><button class="g sm" id="home">홈</button><button class="g sm" id="out" style="color:#e5484d">방 나가기</button><button class="g sm" id="del" style="display:none;color:#e5484d">방 삭제</button></div></header>
  <div id="nt"></div><div id="pb" style="display:none"></div><div id="pl" style="display:none"></div><div id="us"></div><div id="list"></div>
  <div id="rp"></div><form id="f"><button type="button" class="g" id="ph" aria-label="사진 보내기">📷</button><button type="button" class="g" id="pv" aria-label="투표 만들기">📊</button><input type="file" id="fl" accept="image/*" hidden><input id="tx" placeholder="메시지 입력" autocomplete="off" maxlength="500"><button aria-label="전송"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></form>`;
  $("#home").onclick=()=>leave();bindGest();$("#pv").onclick=pollModal;setRep(null);
  $("#del").onclick=async()=>{
    const v=prompt("방을 삭제하면 모든 메시지와 참여자가 지워지고, 아무도 다시 들어오거나 채팅을 보낼 수 없어요. 되돌릴 수 없어요.\n\n삭제하려면 방 코드 "+code+" 를 그대로 입력하세요.");
    if(v===null)return;
    if(v.trim().toUpperCase()!==String(code).toUpperCase()){alert("방 코드가 달라서 취소했어요");return}
    const{data,error}=await sb.rpc("delete_room",{p_code:code});
    if(error){alert("방 삭제 실패: "+error.message);return}
    leave(data===false?"방을 닫았어요. 이 코드는 다시 만들 수 없어요":"방을 삭제했어요. 같은 코드로 다시 만들 수 있어요");
  };
  $("#out").onclick=async()=>{
    if(!confirm("이 방에서 완전히 나갈까요?\n내가 들어간 방 목록에서도 사라지고, 다시 들어오려면 코드를 입력해야 해요."))return;
    const{error}=await sb.rpc("leave_room",{p_code:code});
    if(error){alert("나가기 실패: "+error.message);return}
    leave();
  };
  $("#ph").onclick=()=>$("#fl").click();
  $("#fl").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)sendImg(f)};
  $("#ub").onclick=()=>{const u=$("#us");u.style.display=u.style.display==="flex"?"none":"flex"};
  $("#clr").onclick=async()=>{if(!confirm("모든 메시지를 삭제할까요?"))return;const{error}=await sb.rpc("clear_room",{p_code:code});if(error){alert("전체삭제 실패: "+error.message);return}msgs=[];draw();poll(true)};
  $("#f").onsubmit=async e=>{e.preventDefault();let v=$("#tx").value.trim();if(!v)return;if(rep)v=mkRe(rep,v);if(v.length>500){alert("답장은 본문 "+(500-v.length+$("#tx").value.trim().length)+"자까지 입력할 수 있어요");return}$("#tx").value="";setRep(null);
    const tmp={id:"t"+Date.now(),user_id:uid,name:(members[uid]||{}).name||"",role:myRole(),text:v,expires_at:new Date(Date.now()+off+TTL).toISOString(),tmp:1,at:Date.now()};
    msgs.push(tmp);draw();
    const{error}=await sb.rpc("send_message",{p_code:code,p_text:v});
    if(error){msgs=msgs.filter(x=>x!==tmp);draw();alert("전송 실패: "+error.message)}};

  const{data:ts}=await sb.rpc("server_time");off=new Date(ts)-Date.now();
  const[{data:ms},{data:mm}]=await Promise.all([
    sb.from("members").select("*").eq("room_code",code),
    sb.from("messages").select("*").eq("room_code",code).gt("expires_at",new Date(Date.now()+off).toISOString()).order("created_at")]);
  (ms||[]).forEach(m=>members[m.user_id]=m);msgs=mm||[];
  head();drawUsers();draw();

  ch=sb.channel("room:"+code,{config:{presence:{key:uid}}})
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_code=eq."+code},p=>{if(!msgs.some(x=>x.id===p.new.id)){msgs=msgs.filter(x=>!(x.tmp&&x.user_id===p.new.user_id&&x.text===p.new.text));msgs.push(p.new)}draw()})
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"room_code=eq."+code},p=>{const m=msgs.find(x=>x.id===p.new.id);if(m){Object.assign(m,p.new);draw()}})
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{msgs=msgs.filter(m=>m.id!==p.old.id);draw()})
   .on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"room_code=eq."+code},p=>{
      if(p.new&&p.new.user_id){members[p.new.user_id]=p.new;head();drawUsers();draw()}})
   .on("presence",{event:"sync"},()=>{online=new Set(Object.keys(ch.presenceState()));drawUsers()})
   .subscribe(s=>{if(s==="SUBSCRIBED")ch.track({uid})});
  t1=setInterval(draw,1000);t2=setInterval(()=>{sb.rpc("purge_expired");sb.rpc("purge_extras")},10000);t3=setInterval(poll,2000);poll();
}
function leave(m){if(ch)sb.removeChannel(ch);clearInterval(t1);clearInterval(t2);clearInterval(t3);ch=null;code="";login(typeof m==="string"?m:"")}
async function poll(force){
  if(!code)return;
  const now=new Date(Date.now()+off).toISOString();
  const{data,error}=await sb.from("messages").select("*").eq("room_code",code).gt("expires_at",now).order("created_at");
  if(error){console.error(error);return}
  if(data){const tm=msgs.filter(x=>x.tmp&&Date.now()-x.at<8000&&!data.some(d=>d.user_id===x.user_id&&d.text===x.text));msgs=data.concat(tm);draw()}
  {const{data:xd,error:xe}=await sb.rpc("room_extras",{p_code:code});if(!xe&&xd){ex=xd;draw()}}
  if(!force&&pn++%3)return;
  const{data:ms}=await sb.from("members").select("*").eq("room_code",code);
  if(ms){members={};ms.forEach(m=>members[m.user_id]=m);if(!members[uid]){leave("이 방에서 나가졌어요. 방이 삭제되었거나 차단되었을 수 있어요.");return}if(myRole()==="admin"){const{data:bs}=await sb.from("bans").select("*").eq("room_code",code);bans=bs||[]}else bans=[];
  head();drawUsers()}
}
function head(){const r=myRole();$("#rl").innerHTML=tag(r);$("#clr").style.display=r==="admin"?"":"none";$("#out").style.display=r==="admin"?"none":"";$("#del").style.display=r==="admin"?"":"none"}
function drawUsers(){
  const list=Object.values(members).sort((x,y)=>(online.has(y.user_id)-online.has(x.user_id))||String(x.name).localeCompare(y.name)),r=myRole();
  const on=list.filter(u=>online.has(u.user_id)).length;
  $("#ub").textContent="참여자 "+list.length;
  let h=`<div class="sys" style="align-self:flex-start">온라인 ${on}명 · 참여자 ${list.length}명</div>`;
  h+=list.map(u=>`<div class="u"><span><i class="on ${online.has(u.user_id)?"":"off"}"></i>${esc(u.name)}${tag(u.role)}${u.user_id===uid?" (나)":""}</span>
  ${(r==="admin"&&u.role!=="admin")||(r==="sub"&&u.role==="user")?`<span class="row">${r==="admin"?`<button class="g sm" data-u="${u.user_id}" data-r="${u.role==="sub"?"user":"sub"}">${u.role==="sub"?"부관리자 해제":"부관리자 지정"}</button><button class="g sm" data-host="${u.user_id}">방장 넘기기</button>`:""}<button class="g sm" data-ban="${u.user_id}" style="color:#e5484d">차단</button></span>`:""}</div>`).join("");

const BUCKET="chat-images",IMGP=SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/";
const imgUrl=t=>{t=t||"";return t.startsWith("[img]")&&t.slice(5).startsWith(IMGP)?t.slice(5):""};
let sig="",stick=true,upl=false;
function imgLoad(){const l=$("#list");if(l&&stick)l.scrollTop=l.scrollHeight}
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):no(new Error("변환에 실패했어요")),"image/jpeg",.75)};
  i.onerror=()=>no(new Error("이미지를 읽을 수 없어요"));i.src=u})}
async function sendImg(f){
  if(upl||!code)return;
  if(!f.type.startsWith("image/")){alert("이미지 파일만 보낼 수 있어요");return}
  upl=true;const pb=$("#ph");if(pb)pb.disabled=true;
  try{
    const blob=await shrink(f),path=code+"/"+uid+"/"+Date.now()+".jpg",bk=sb.storage.from(BUCKET);
    const{error:ue}=await bk.upload(path,blob,{contentType:"image/jpeg"});if(ue)throw ue;
    const url=bk.getPublicUrl(path).data.publicUrl;
    const{error}=await sb.rpc("send_message",{p_code:code,p_text:"[img]"+url});
    if(error){bk.remove([path]);throw error}
    setTimeout(()=>bk.remove([path]),TTL+15000);
    poll(true);
  }catch(e){alert("사진 전송 실패: "+(e.message||e))}
  finally{upl=false;const p2=$("#ph");if(p2)p2.disabled=false}
}

let rep=null,ex={notes:[],polls:[],reacts:[]},gest=0,openPl=false,sn="",sp="",g=null;
const RX=["❤️","👍","😂","😮","😢","🙏"];
function parseRe(t){if(!t||!t.startsWith("[re]"))return null;const a=t.slice(4).split("\n");if(a.length<3)return null;const i=a[0].indexOf("|");return{id:i<0?"":a[0].slice(0,i),name:i<0?a[0]:a[0].slice(i+1),snip:a[1],body:a.slice(2).join("\n")}}
const mkRe=(r,v)=>"[re]"+(r.id||"")+"|"+r.name+"\n"+r.snip+"\n"+v;
const plain=t=>{if(imgUrl(t))return"📷 사진";const r=parseRe(t);return(r?r.body:t).replace(/\s+/g," ").slice(0,30)};
const bodyHtml=t=>{const r=parseRe(t);return r?`<div class="rq" data-rt="${esc(r.id)}">↩ ${esc(r.name)}: ${esc(r.snip)}</div>${esc(r.body)}`:esc(t)};
const rxSig=()=>ex.reacts.map(r=>r.m+r.u+r.e).join(",")+"#";
function rxHtml(id){const o={};ex.reacts.forEach(r=>{if(String(r.m)!==String(id))return;const x=o[r.e]||(o[r.e]={n:0,my:0});x.n++;if(r.u===uid)x.my=1});
  const k=Object.keys(o);return k.length?`<div class="rx">${k.map(e=>`<i data-rx="${esc(id)}" data-emo="${esc(e)}" class="${o[e].my?"my":""}">${e} ${o[e].n}</i>`).join("")}</div>`:""}
function setRep(r){rep=r;const b=$("#rp");if(!b)return;b.style.display=r?"flex":"none";
  if(r){b.innerHTML=`<span>↩ ${esc(r.name)}: ${esc(r.snip)}</span><a id="rpx">✕</a>`;$("#rpx").onclick=()=>setRep(null);$("#tx").focus()}}
const findM=id=>msgs.find(z=>String(z.id)===String(id));
function startReply(id){const m=findM(id);if(m&&!m.tmp)setRep({id:String(m.id),name:m.name,snip:plain(m.text)})}
async function react(id,e){const{error}=await sb.rpc("react",{p_code:code,p_msg:String(id),p_emoji:e});if(error)alert("이모지 실패: "+error.message);else poll(true)}
async function notice(m){if(imgUrl(m.text)){alert("사진은 공지로 올릴 수 없어요");return}
  const r=parseRe(m.text),b=(r?r.body:m.text).trim().slice(0,200);
  const{error}=await sb.rpc("post_notice",{p_code:code,p_text:b,p_author:m.name||""});if(error)alert("공지 실패: "+error.message);else poll(true)}
function closePk(){const p=$("#pk");if(p)p.remove()}
function openPk(el){closePk();const m=findM(el.dataset.mid);if(!m||m.tmp)return;
  const p=document.createElement("div");p.id="pk";
  p.innerHTML=`<div>${RX.map(e=>`<b data-pe="${e}">${e}</b>`).join("")}</div><div class="pa"><a data-pa="re">↩ 답장</a>${myRole()!=="user"?'<a data-pa="nt">📢 공지</a>':""}</div>`;
  document.body.appendChild(p);

  p.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";
  p.style.top=(r.top-h-6<8?r.bottom+6:r.top-h-6)+"px";

    if(a.dataset.pe)react(m.id,a.dataset.pe);else if(a.dataset.pa==="re")startReply(m.id);else notice(m)};
  const out=ev=>{if(ev.target.closest("#pk"))document.addEventListener("pointerdown",out,{once:true});else closePk()};
  setTimeout(()=>document.addEventListener("pointerdown",out,{once:true}),0)}
function bindGest(){const l=$("#list");
  l.addEventListener("pointerdown",e=>{const el=e.target.closest(".m[data-mid]");if(!el||e.target.closest(".t a,.rx"))return;
    g={el,x:e.clientX,y:e.clientY,dx:0,mode:"",t:setTimeout(()=>{if(g&&!g.mode){g.mode="lp";openPk(g.el)}},450)};gest=1});

document.addEventListener("pointermove",e=>{if(!g)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){clearTimeout(g.t);g.mode=Math.abs(dx)>Math.abs(dy)&&dx<0?"sw":"no"}

function pollModal(){const d=document.createElement("div");d.id="md";
  d.innerHTML=`<div class="box"><b>📊 투표 만들기</b><input id="pq" maxlength="100" placeholder="질문"><div id="po"></div><div class="row"><button class="g sm" id="pa">+ 항목 추가</button></div><p class="s">끝내기 전까지 24시간 유지돼요 · 방마다 동시에 20개까지</p><div class="row"><button class="g" id="pc">취소</button><button id="pg">만들기</button></div></div>`;

function toast(x){const d=document.createElement("div");d.textContent=x;d.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;z-index:11";document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function goOrig(id){const el=id&&[...document.querySelectorAll("#list .m[data-mid]")].find(x=>x.dataset.mid===id);
  if(!el){toast("원본 메시지가 이미 사라졌어요");return}

function drawEx(){const now=Date.now()+off,mod=myRole()!=="user";
  const ns=(ex.notes||[]).filter(n=>Date.parse(n.expires_at)>now),ps=(ex.polls||[]).filter(p=>Date.parse(p.ends_at)>now);
  const nh=ns.map(n=>`<div class="ni"><span>📢 <b>${esc(n.name||"")}</b> ${esc(n.text)}</span><small>${Math.ceil((Date.parse(n.expires_at)-now)/60000)}분</small>${mod?`<a data-dn="${n.id}">✕</a>`:""}</div>`).join("");
  if(nh!==sn){sn=nh;const b=$("#nt");if(b){b.innerHTML=nh;b.style.display=nh?"block":"none"}}
  const ph=(ps.length?`<button class="g" id="pbb">📊 진행 중인 투표 ${ps.length}개 ${openPl?"▴":"▾"}</button>`:"")+"\u0001"+(openPl?ps.map(p=>{
    const c=p.counts||{},tot=p.opts.reduce((a,_,i)=>a+(c[i]||0),0),left=Math.max(1,Math.ceil((Date.parse(p.ends_at)-now)/3600000));
    return`<div><div class="pq">${esc(p.q)}</div>${p.opts.map((t,i)=>{const n=c[i]||0;return`<div class="po${p.mine===i?" my":""}" data-v="${p.id}" data-i="${i}"><div class="pf" style="width:${tot?Math.round(n/tot*100):0}%"></div><span>${esc(t)}</span><small>${n}표</small></div>`}).join("")}<div class="pm"><span>${esc(p.name||"")} · ${tot}명 참여 · ${left}시간 남음</span>${p.by===uid||mod?`<a data-ep="${p.id}">끝내기</a>`:""}</div></div>`}).join(""):"");
  if(ph!==sp){sp=ph;const[a,b]=ph.split("\u0001"),pb=$("#pb"),pl=$("#pl");if(pb){pb.innerHTML=a;pb.style.display=a?"":"none";pl.innerHTML=b;pl.style.display=b?"flex":"none"}}}
document.addEventListener("click",async e=>{const t=e.target;let a,r;
  if(a=t.closest("[data-rt]")){goOrig(a.dataset.rt);return}
  if(a=t.closest("[data-rx]")){await react(a.dataset.rx,a.dataset.emo);return}
  if(a=t.closest("[data-v]")){r=await sb.rpc("vote",{p_poll:a.dataset.v,p_choice:+a.dataset.i});if(r.error)alert("투표 실패: "+r.error.message);else poll(true);return}
  if(a=t.closest("[data-ep]")){if(!confirm("이 투표를 끝낼까요?"))return;r=await sb.rpc("end_poll",{p_poll:a.dataset.ep});if(r.error)alert("실패: "+r.error.message);else poll(true);return}
  if(a=t.closest("[data-dn]")){r=await sb.rpc("delete_notice",{p_id:a.dataset.dn});if(r.error)alert("실패: "+r.error.message);else poll(true);return}
  if(t.closest("#pbb")){openPl=!openPl;sp="";drawEx()}});
function draw(){
  const l=$("#list");if(!l)return;const now=Date.now()+off,mod=myRole()!=="user";
  msgs=msgs.filter(m=>Date.parse(m.expires_at)>now);
  const s=(mod?"1":"0")+rxSig()+msgs.map(m=>m.id+"|"+m.name+"|"+((members[m.user_id]||{}).role||m.role||"")+"|"+m.text).join("\n");
  if(s!==sig&&!gest){
    sig=s;const end=l.scrollHeight-l.scrollTop-l.clientHeight<80;stick=end;
    l.innerHTML=msgs.length?msgs.map(m=>{const u=imgUrl(m.text),e=Date.parse(m.expires_at),own=m.user_id===uid&&!m.tmp&&!u;
      return`<div class="m ${m.user_id===uid?"me":""}" data-mid="${m.id}"><div class="n">${esc(m.name)}${tag((members[m.user_id]||{}).role||m.role)}</div>
  ${u?`<div class="b img"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="사진" onload="imgLoad()"></a></div>`:`<div class="b">${bodyHtml(m.text)}</div>`}${m.tmp?"":rxHtml(m.id)}<div class="bar" data-e="${e}"></div>
  <div class="t"><span data-e="${e}"></span>${own?` <a class="ed" data-edit="${m.id}">수정</a>`:""}${mod&&!m.tmp?` <a data-id="${m.id}">삭제</a>`:""}</div></div>`}).join(""):`<div class="sys">메시지가 없어요.</div>`;
    if(end)l.scrollTop=l.scrollHeight;
  }
  l.querySelectorAll("div.bar[data-e]").forEach(e=>e.style.width=Math.max(0,(e.dataset.e-now)/TTL*100)+"%");
  l.querySelectorAll("span[data-e]").forEach(e=>e.textContent=Math.ceil((e.dataset.e-now)/1000)+"초 후 삭제");
  drawEx();
}
document.addEventListener("click",async e=>{

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minute</title>
<style>
:root{--bg:#fff;--sf:#f2f3f7;--tx:#16181d;--mu:#767b88;--ac:#5b5bf0;--bd:#e3e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--sf:#1e2026;--tx:#eceef3;--mu:#8b909c;--bd:#2c2f38}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.center{margin:auto;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:34px;margin:0}h1 span{color:var(--ac)}
p.s{color:var(--mu);margin:0;font-size:14px}
input{font:inherit;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:100%;outline:none}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;flex:1}
button.g{background:var(--sf);color:var(--tx)}button.sm{padding:6px 10px;font-size:12px;border-radius:8px;flex:none}
.row{display:flex;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);gap:8px}
header small{color:var(--mu);display:block;font-size:12px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;align-self:flex-start}.m.me{align-self:flex-end}
.n{font-size:12px;color:var(--mu);margin:0 4px 2px}
.b{background:var(--sf);padding:9px 13px;border-radius:16px;word-break:break-word;white-space:pre-wrap}
.me .b{background:var(--ac);color:#fff}
.bar{height:2px;background:var(--ac);margin:3px 4px 0;border-radius:2px;opacity:.5}
.t{font-size:11px;color:var(--mu);margin:2px 4px;display:flex;gap:6px}.t a{color:#e5484d;cursor:pointer;padding:4px 8px;margin:-4px 0}
.b.img{padding:4px;line-height:0}.b.img img{max-width:100%;max-height:260px;border-radius:12px;display:block;cursor:zoom-in}
.t a.ed{color:var(--ac)}form button.g{background:var(--sf);font-size:18px}
.sys{align-self:center;color:var(--mu);font-size:12px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
.tag{color:#fff;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700}
.admin{background:#f5a623}.sub{background:#2fb344}.crown{margin-left:4px;font-size:13px}form button{flex:none;width:48px;padding:0;display:grid;place-items:center}
#rm{display:flex;flex-direction:column;gap:8px}.rm{display:flex;justify-content:space-between;align-items:center;text-align:left;flex:none}.rm small{color:var(--mu);font-weight:500}
.err{color:#e5484d;font-size:13px;min-height:16px}
#us{display:none;max-height:40vh;overflow-y:auto;padding:8px 12px;border-bottom:1px solid var(--bd);gap:6px;flex-direction:column}
#us .u{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb344;margin-right:6px}.off{background:var(--mu)}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
// ▼ Supabase > Project Settings > API 에서 복사해 붙여넣기
const SUPABASE_URL="https://drqjyvhgztnquadkpcyy.supabase.co";
const SUPABASE_KEY="sb_publishable_kCn-7ZjtLnMQ0WJwXdwZcQ_Dct1mqvr";

const $=s=>document.querySelector(s),app=$("#app"),TTL=60000;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const tag=r=>r==="admin"?'<span class="crown" title="관리자">👑</span>':r==="sub"?'<span class="tag sub">부관리자</span>':"";
let sb,uid,code,msgs=[],members={},online=new Set(),ch=null,t1=null,t2=null,t3=null,off=0,pn=0,bans=[];
const myRole=()=>(members[uid]||{}).role||"user";
function dev(){let d=st.get("m_dev");
  if(!d){const m=document.cookie.match(/(?:^|; )m_dev=([^;]+)/);d=m?m[1]:""}
  if(!d)d=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());
  st.set("m_dev",d);try{document.cookie="m_dev="+d+"; max-age=315360000; path=/; SameSite=Lax"}catch{}
  return d}

async function rooms(){
  try{
    if(!uid){const{data:{session}}=await sb.auth.getSession();if(!session)return;uid=session.user.id}
    const{data,error}=await sb.from("members").select("room_code,name,role").eq("user_id",uid);
    const box=$("#rm");if(!box||error||!data||!data.length)return;
    box.innerHTML='<p class="s">내가 들어간 방</p>'+data.map(r=>`<button class="g rm" data-rc="${esc(r.room_code)}"><span>${esc(r.room_code)}</span><small>${esc(r.name)}${tag(r.role)}</small></button>`).join("");
    box.querySelectorAll("[data-rc]").forEach(b=>b.onclick=async()=>{b.disabled=true;
      try{await enter(b.dataset.rc)}catch(e){const er=$("#er");if(er)er.textContent=e.message||"입장에 실패했어요";b.disabled=false}});
  }catch(e){console.error(e)}
}
function login(msg){
  app.innerHTML=`<div class="center"><h1>Min<span>ute</span></h1><p class="s">보낸 메시지는 1분 뒤 사라져요. 방을 만든 사람이 관리자예요.</p>
  <div id="rm"></div>
  <input id="nm" placeholder="이름 (닉네임)" maxlength="16" value="${esc(st.get("m_name"))}">
  <input id="cd" placeholder="방 코드 (영문/숫자 4~12자)" maxlength="12" style="text-transform:uppercase" value="${esc(st.get("m_code"))}">
  <div class="err" id="er">${esc(msg||"")}</div>
  <div class="row"><button class="g" id="mk">방 만들기</button><button id="jn">입장</button></div></div>`;
  rooms();
  const go=fn=>async()=>{
    const n=$("#nm").value.trim(),c=$("#cd").value.trim().toUpperCase();
    st.set("m_name",n);st.set("m_code",c);$("#er").textContent="";
    try{
      if(!uid){const{data:{session}}=await sb.auth.getSession();
        if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}
        uid=(await sb.auth.getUser()).data.user.id}
      const{data,error}=await sb.rpc(fn,{p_code:c,p_name:n,p_device:dev()});
      if(error)throw new Error(/members_room_name_uniq/i.test(error.message)?'이 방에 같은 이름이 이미 있어요. 다른 이름을 써주세요':/duplicate/i.test(error.message)?'이미 있는 코드예요':error.message);
      if(!data)throw new Error(fn==='create_room'?'이미 있는 코드이거나 입력이 올바르지 않아요 (코드는 영문/숫자 4~12자)':'없는 코드이거나 입장할 수 없어요');
      await enter(c);
    }catch(e){$("#er").textContent=e.message||"실패했어요"}
  };
  $("#mk").onclick=go("create_room");$("#jn").onclick=go("join_room");
}

async function enter(c){
  code=c;msgs=[];members={};online=new Set();bans=[];
  app.innerHTML=`<header><div><b>Minute</b><span id="rl"></span><small>코드 ${esc(c)}</small></div>
  <div class="row"><button class="g sm" id="ub"></button><button class="g sm" id="clr" style="display:none">전체삭제</button><button class="g sm" id="out">나가기</button></div></header>
  <div id="us"></div><div id="list"></div>
  <form id="f"><button type="button" class="g" id="ph" aria-label="사진 보내기">📷</button><input type="file" id="fl" accept="image/*" hidden><input id="tx" placeholder="메시지 입력" autocomplete="off" maxlength="500"><button aria-label="전송"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></form>`;
  $("#out").onclick=leave;
  $("#ph").onclick=()=>$("#fl").click();
  $("#fl").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)sendImg(f)};
  $("#ub").onclick=()=>{const u=$("#us");u.style.display=u.style.display==="flex"?"none":"flex"};
  $("#clr").onclick=async()=>{if(!confirm("모든 메시지를 삭제할까요?"))return;const{error}=await sb.rpc("clear_room",{p_code:code});if(error){alert("전체삭제 실패: "+error.message);return}msgs=[];draw();poll(true)};
  $("#f").onsubmit=async e=>{e.preventDefault();const v=$("#tx").value.trim();if(!v)return;$("#tx").value="";
    const tmp={id:"t"+Date.now(),user_id:uid,name:(members[uid]||{}).name||"",role:myRole(),text:v,expires_at:new Date(Date.now()+off+TTL).toISOString(),tmp:1,at:Date.now()};
    msgs.push(tmp);draw();
    const{error}=await sb.rpc("send_message",{p_code:code,p_text:v});
    if(error){msgs=msgs.filter(x=>x!==tmp);draw();alert("전송 실패: "+error.message)}};

  const{data:ts}=await sb.rpc("server_time");off=new Date(ts)-Date.now();
  const[{data:ms},{data:mm}]=await Promise.all([
    sb.from("members").select("*").eq("room_code",code),
    sb.from("messages").select("*").eq("room_code",code).gt("expires_at",new Date(Date.now()+off).toISOString()).order("created_at")]);
  (ms||[]).forEach(m=>members[m.user_id]=m);msgs=mm||[];
  head();drawUsers();draw();

  ch=sb.channel("room:"+code,{config:{presence:{key:uid}}})
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_code=eq."+code},p=>{if(!msgs.some(x=>x.id===p.new.id)){msgs=msgs.filter(x=>!(x.tmp&&x.user_id===p.new.user_id&&x.text===p.new.text));msgs.push(p.new)}draw()})
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"room_code=eq."+code},p=>{const m=msgs.find(x=>x.id===p.new.id);if(m){Object.assign(m,p.new);draw()}})
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{msgs=msgs.filter(m=>m.id!==p.old.id);draw()})
   .on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"room_code=eq."+code},p=>{
      if(p.new&&p.new.user_id){members[p.new.user_id]=p.new;head();drawUsers();draw()}})
   .on("presence",{event:"sync"},()=>{online=new Set(Object.keys(ch.presenceState()));drawUsers()})
   .subscribe(s=>{if(s==="SUBSCRIBED")ch.track({uid})});
  t1=setInterval(draw,1000);t2=setInterval(()=>sb.rpc("purge_expired"),10000);t3=setInterval(poll,2000);poll();
}
function leave(m){if(ch)sb.removeChannel(ch);clearInterval(t1);clearInterval(t2);clearInterval(t3);ch=null;code="";login(typeof m==="string"?m:"")}
async function poll(force){
  if(!code)return;
  const now=new Date(Date.now()+off).toISOString();
  const{data,error}=await sb.from("messages").select("*").eq("room_code",code).gt("expires_at",now).order("created_at");
  if(error){console.error(error);return}
  if(data){const tm=msgs.filter(x=>x.tmp&&Date.now()-x.at<8000&&!data.some(d=>d.user_id===x.user_id&&d.text===x.text));msgs=data.concat(tm);draw()}
  if(!force&&pn++%3)return;
  const{data:ms}=await sb.from("members").select("*").eq("room_code",code);
  if(ms){members={};ms.forEach(m=>members[m.user_id]=m);if(!members[uid]){leave("이 방에서 나가졌어요. 차단되었을 수 있어요.");return}if(myRole()==="admin"){const{data:bs}=await sb.from("bans").select("*").eq("room_code",code);bans=bs||[]}else bans=[];
  head();drawUsers()}
}
function head(){const r=myRole();$("#rl").innerHTML=tag(r);$("#clr").style.display=r==="admin"?"":"none"}
function drawUsers(){
  const list=Object.values(members).sort((x,y)=>(online.has(y.user_id)-online.has(x.user_id))||String(x.name).localeCompare(y.name)),r=myRole();
  const on=list.filter(u=>online.has(u.user_id)).length;
  $("#ub").textContent="참여자 "+list.length;
  let h=`<div class="sys" style="align-self:flex-start">온라인 ${on}명 · 참여자 ${list.length}명</div>`;
  h+=list.map(u=>`<div class="u"><span><i class="on ${online.has(u.user_id)?"":"off"}"></i>${esc(u.name)}${tag(u.role)}${u.user_id===uid?" (나)":""}</span>
  ${(r==="admin"&&u.role!=="admin")||(r==="sub"&&u.role==="user")?`<span class="row">${r==="admin"?`<button class="g sm" data-u="${u.user_id}" data-r="${u.role==="sub"?"user":"sub"}">${u.role==="sub"?"부관리자 해제":"부관리자 지정"}</button>`:""}<button class="g sm" data-ban="${u.user_id}" style="color:#e5484d">차단</button></span>`:""}</div>`).join("");
  if(r==="admin"&&bans.length)h+=`<div class="sys" style="align-self:flex-start;margin-top:6px">차단됨 ${bans.length}명</div>`+bans.map(x=>`<div class="u"><span>${esc(x.name||"알 수 없음")}</span><button class="g sm" data-unban="${x.id}">차단 해제</button></div>`).join("");
  $("#us").innerHTML=h;
  document.querySelectorAll("[data-u]").forEach(x=>x.onclick=async()=>{x.disabled=true;
    const{error}=await sb.rpc("set_role",{p_code:code,p_target:x.dataset.u,p_role:x.dataset.r});
    if(error){alert("변경 실패: "+error.message);x.disabled=false}else poll(true)});
  document.querySelectorAll("[data-ban]").forEach(x=>x.onclick=async()=>{if(!confirm("이 기기를 이 방에서 차단할까요? 다시 입장할 수 없어요."))return;
    const{error}=await sb.rpc("ban_user",{p_code:code,p_target:x.dataset.ban});if(error)alert("차단 실패: "+error.message);else poll(true)});
  document.querySelectorAll("[data-unban]").forEach(x=>x.onclick=async()=>{
    const{error}=await sb.rpc("unban_user",{p_code:code,p_id:x.dataset.unban});if(error)alert("해제 실패: "+error.message);else poll(true)});
}
const BUCKET="chat-images",IMGP=SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/";
const imgUrl=t=>{t=t||"";return t.startsWith("[img]")&&t.slice(5).startsWith(IMGP)?t.slice(5):""};
let sig="",stick=true,upl=false;
function imgLoad(){const l=$("#list");if(l&&stick)l.scrollTop=l.scrollHeight}
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):no(new Error("변환에 실패했어요")),"image/jpeg",.75)};
  i.onerror=()=>no(new Error("이미지를 읽을 수 없어요"));i.src=u})}
async function sendImg(f){
  if(upl||!code)return;
  if(!f.type.startsWith("image/")){alert("이미지 파일만 보낼 수 있어요");return}
  upl=true;const pb=$("#ph");if(pb)pb.disabled=true;
  try{
    const blob=await shrink(f),path=code+"/"+uid+"/"+Date.now()+".jpg",bk=sb.storage.from(BUCKET);
    const{error:ue}=await bk.upload(path,blob,{contentType:"image/jpeg"});if(ue)throw ue;
    const url=bk.getPublicUrl(path).data.publicUrl;
    const{error}=await sb.rpc("send_message",{p_code:code,p_text:"[img]"+url});
    if(error){bk.remove([path]);throw error}
    setTimeout(()=>bk.remove([path]),TTL+15000);
    poll(true);
  }catch(e){alert("사진 전송 실패: "+(e.message||e))}
  finally{upl=false;const p2=$("#ph");if(p2)p2.disabled=false}
}
function draw(){
  const l=$("#list");if(!l)return;const now=Date.now()+off,mod=myRole()!=="user";
  msgs=msgs.filter(m=>Date.parse(m.expires_at)>now);
  const s=(mod?"1":"0")+msgs.map(m=>m.id+"|"+m.name+"|"+((members[m.user_id]||{}).role||m.role||"")+"|"+m.text).join("\n");
  if(s!==sig){
    sig=s;const end=l.scrollHeight-l.scrollTop-l.clientHeight<80;stick=end;
    l.innerHTML=msgs.length?msgs.map(m=>{const u=imgUrl(m.text),e=Date.parse(m.expires_at),own=m.user_id===uid&&!m.tmp&&!u;
      return`<div class="m ${m.user_id===uid?"me":""}"><div class="n">${esc(m.name)}${tag((members[m.user_id]||{}).role||m.role)}</div>
  ${u?`<div class="b img"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="사진" onload="imgLoad()"></a></div>`:`<div class="b">${esc(m.text)}</div>`}<div class="bar" data-e="${e}"></div>
  <div class="t"><span data-e="${e}"></span>${own?` <a class="ed" data-edit="${m.id}">수정</a>`:""}${mod&&!m.tmp?` <a data-id="${m.id}">삭제</a>`:""}</div></div>`}).join(""):`<div class="sys">메시지가 없어요.</div>`;
    if(end)l.scrollTop=l.scrollHeight;
  }
  l.querySelectorAll("div.bar[data-e]").forEach(e=>e.style.width=Math.max(0,(e.dataset.e-now)/TTL*100)+"%");
  l.querySelectorAll("span[data-e]").forEach(e=>e.textContent=Math.ceil((e.dataset.e-now)/1000)+"초 후 삭제");
}
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest("a[data-edit]");if(!a)return;
  const id=a.dataset.edit,m=msgs.find(x=>String(x.id)===id);if(!m)return;
  const v=prompt("메시지 수정",m.text);if(v===null)return;const t=v.trim();
  if(!t||t===m.text)return;
  if(t.length>500){alert("500자까지 입력할 수 있어요");return}
  if(t.startsWith("[img]")){alert("이 형식으로는 수정할 수 없어요");return}
  const{data,error}=await sb.rpc("edit_message",{p_id:id,p_text:t});
  if(error){alert("수정 실패: "+error.message);return}
  if(data===false){alert("수정할 수 없어요. 이미 사라졌거나 내 메시지가 아니에요");return}
  m.text=t;draw();poll(true);
});
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest("a[data-id]");if(!a)return;
  const id=a.dataset.id;
  if(id[0]==="t"){msgs=msgs.filter(m=>m.id!==id);draw();return}
  const{error}=await sb.rpc("delete_message",{p_id:id});
  if(error){alert("삭제 실패: "+error.message);return}
  msgs=msgs.filter(m=>String(m.id)!==String(id));draw();
});
if(SUPABASE_URL.includes("YOUR-PROJECT")){app.innerHTML='<div class="center"><h1>Min<span>ute</span></h1><p class="s">index.html 위쪽의 SUPABASE_URL과 SUPABASE_KEY를 먼저 채워주세요.</p></div>'}
else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);login()}
</script></body></html>
